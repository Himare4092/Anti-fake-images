name: Release (Build Lite .exe)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag name (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install CPU PyTorch and dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.6.0 torchvision==0.21.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt pyinstaller

      - name: Build Lite .exe with PyInstaller
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean AntiFakeImageDetector_Lite.spec

      - name: Compress Lite package with 7z
        shell: pwsh
        run: |
          7z a -t7z -mx=5 AntiFakeImageDetector_Lite-win64.7z .\dist\AntiFakeImageDetector_Lite

      - name: Determine release tag
        id: tag
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            "name=${{ inputs.tag_name }}" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            "name=${{ github.ref_name }}" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Create GitHub Release and upload .7z
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          files: |
            AntiFakeImageDetector_Lite-win64.7z
